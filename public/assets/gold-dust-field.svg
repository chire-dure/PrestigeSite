<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <!-- Soft Champagne Gold Micro-Glow -->
    <filter id="champagneGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="softGoldBokeh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5CF92" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#C5A869" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#C5A869" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Soft Ambient Champagne Light Flecks -->
  <circle cx="48" cy="52" r="4" fill="url(#softGoldBokeh)" />
  <circle cx="180" cy="110" r="5" fill="url(#softGoldBokeh)" />
  <circle cx="275" cy="42" r="3.5" fill="url(#softGoldBokeh)" />
  <circle cx="95" cy="210" r="4.5" fill="url(#softGoldBokeh)" />
  <circle cx="230" cy="245" r="5.5" fill="url(#softGoldBokeh)" />
  <circle cx="140" cy="290" r="3.8" fill="url(#softGoldBokeh)" />
  <circle cx="295" cy="175" r="4.2" fill="url(#softGoldBokeh)" />
  <circle cx="25" cy="155" r="3.6" fill="url(#softGoldBokeh)" />

