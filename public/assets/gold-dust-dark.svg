<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <filter id="darkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="darkBokeh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8C42E" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#C5A869" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#C5A869" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Soft Gold Stardust Bokeh Discs -->
  <circle cx="65" cy="85" r="9" fill="url(#darkBokeh)" />
  <circle cx="210" cy="140" r="12" fill="url(#darkBokeh)" />
  <circle cx="380" cy="95" r="8" fill="url(#darkBokeh)" />
  <circle cx="440" cy="220" r="10" fill="url(#darkBokeh)" />
  <circle cx="120" cy="330" r="11" fill="url(#darkBokeh)" />
  <circle cx="280" cy="290" r="14" fill="url(#darkBokeh)" />
  <circle cx="410" cy="390" r="9" fill="url(#darkBokeh)" />
  <circle cx="170" cy="440" r="8" fill="url(#darkBokeh)" />

  <!-- Luminous Gold Specks (Clearly Visible on Dark Charcoal #24211D) -->
  <g fill="#F8C42E" opacity="0.95">
    <circle cx="35" cy="48" r="1.8" /><circle cx="82" cy="115" r="2.2" /><circle cx="145" cy="62" r="1.9" />
    <circle cx="195" cy="125" r="2.4" /><circle cx="250" cy="78" r="1.7" /><circle cx="310" cy="105" r="2.1" />
    <circle cx="365" cy="55" r="2.3" /><circle cx="420" cy="118" r="1.8" /><circle cx="475" cy="72" r="2.2" />

    <circle cx="50" cy="190" r="2.0" /><circle cx="110" cy="225" r="1.8" /><circle cx="165" cy="175" r="2.3" />
    <circle cx="225" cy="210" r="2.5" /><circle cx="285" cy="165" r="1.9" /><circle cx="340" cy="220" r="2.2" />
    <circle cx="395" cy="180" r="1.7" /><circle cx="455" cy="235" r="2.1" /><circle cx="490" cy="195" r="1.9" />

    <circle cx="30" cy="310" r="2.2" /><circle cx="95" cy="345" r="1.8" /><circle cx="150" cy="290" r="2.4" />
    <circle cx="205" cy="335" r="2.0" /><circle cx="265" cy="315" r="2.3" /><circle cx="325" cy="355" r="1.9" />
    <circle cx="380" cy="300" r="2.5" /><circle cx="435" cy="330" r="1.8" /><circle cx="485" cy="290" r="2.1" />

    <circle cx="65" cy="425" r="2.3" /><circle cx="130" cy="460" r="1.9" /><circle cx="185" cy="410" r="2.2" />
    <circle cx="240" cy="445" r="1.8" /><circle cx="300" cy="425" r="2.4" /><circle cx="355" cy="470" r="1.7" />
    <circle cx="415" cy="435" r="2.2" /><circle cx="470" cy="465" r="2.0" />
  </g>

  <!-- Shimmering White-Gold Bright Star Points -->
  <g fill="#FFF8DE" opacity="0.9">
    <circle cx="90" cy="65" r="1.5" /><circle cx="170" cy="95" r="1.7" /><circle cx="270" cy="45" r="1.4" />
    <circle cx="345" cy="85" r="1.6" /><circle cx="450" cy="40" r="1.5" /><circle cx="75" cy="165" r="1.6" />
    <circle cx="140" cy="140" r="1.4" /><circle cx="245" cy="155" r="1.8" /><circle cx="315" cy="135" r="1.5" />
    <circle cx="425" cy="160" r="1.7" /><circle cx="60" cy="265" r="1.5" /><circle cx="180" cy="250" r="1.7" />
    <circle cx="230" cy="275" r="1.4" /><circle cx="360" cy="260" r="1.6" /><circle cx="460" cy="275" r="1.5" />
    <circle cx="85" cy="385" r="1.6" /><circle cx="160" cy="365" r="1.4" /><circle cx="220" cy="390" r="1.8" />
    <circle cx="340" cy="415" r="1.5" /><circle cx="445" cy="410" r="1.7" />
  </g>

  <!-- Brilliant Sparkling Diamond Crosses on Charcoal -->
  <g transform="translate(180, 110)" filter="url(#darkGlow)">
    <path d="M 0,-7 Q 0.9,-1.2 5,-0.5 Q 0.9,0 0,7 Q -0.9,0 -5,-0.5 Q -0.9,-1.2 0,-7 Z" fill="#FFFDF5" />
    <circle cx="0" cy="0" r="1.8" fill="#FFFFFF" />
  </g>
  <g transform="translate(410, 85)" filter="url(#darkGlow)">
    <path d="M 0,-6.5 Q 0.8,-1.1 4.5,-0.5 Q 0.8,0 0,6.5 Q -0.8,0 -4.5,-0.5 Q -0.8,-1.1 0,-6.5 Z" fill="#F8C42E" />
    <circle cx="0" cy="0" r="1.6" fill="#FFFFFF" />
  </g>
  <g transform="translate(115, 260)" filter="url(#darkGlow)">
    <path d="M 0,-6 Q 0.8,-1 4,-0.4 Q 0.8,0 0,6 Q -0.8,0 -4,-0.4 Q -0.8,-1 0,-6 Z" fill="#FFFDF5" />
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
  </g>
  <g transform="translate(320, 240)" filter="url(#darkGlow)">
    <path d="M 0,-7 Q 0.9,-1.2 5,-0.5 Q 0.9,0 0,7 Q -0.9,0 -5,-0.5 Q -0.9,-1.2 0,-7 Z" fill="#F8C42E" />
    <circle cx="0" cy="0" r="1.7" fill="#FFFFFF" />
  </g>
  <g transform="translate(255, 380)" filter="url(#darkGlow)">
    <path d="M 0,-6.5 Q 0.8,-1.1 4.5,-0.5 Q 0.8,0 0,6.5 Q -0.8,0 -4.5,-0.5 Q -0.8,-1.1 0,-6.5 Z" fill="#FFFDF5" />
    <circle cx="0" cy="0" r="1.6" fill="#FFFFFF" />
  </g>
  <g transform="translate(435, 345)" filter="url(#darkGlow)">
    <path d="M 0,-5.5 Q 0.7,-1 3.8,-0.4 Q 0.7,0 0,5.5 Q -0.7,0 -3.8,-0.4 Q -0.7,-1 0,-5.5 Z" fill="#F8C42E" />
    <circle cx="0" cy="0" r="1.4" fill="#FFFFFF" />
  </g>
</svg>
